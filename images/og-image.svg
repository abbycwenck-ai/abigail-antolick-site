<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f7f3ec"/>

  <!-- Ochre accent bar on the left -->
  <rect x="0" y="0" width="14" height="630" fill="#d4894a"/>

  <!-- Subtle decorative grid lines -->
  <g stroke="#e8e3d8" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>

  <!-- Eyebrow label -->
  <text x="80" y="140"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20"
        font-weight="700"
        letter-spacing="4"
        fill="#d4894a">MARKETING STRATEGY + DASHBOARDS</text>

  <!-- Main name -->
  <text x="80" y="240"
        font-family="Georgia, 'Libre Baskerville', serif"
        font-size="86"
        font-weight="700"
        fill="#1f3934"
        letter-spacing="-2">Abigail Antolick</text>

  <!-- Tagline line 1 -->
  <text x="80" y="320"
        font-family="Georgia, 'Libre Baskerville', serif"
        font-size="42"
        font-style="italic"
        fill="#1f3934">Strategy that moves the needle.</text>

  <!-- Tagline line 2 -->
  <text x="80" y="370"
        font-family="Georgia, 'Libre Baskerville', serif"
        font-size="42"
        font-style="italic"
        fill="#1f3934">Dashboards that prove it.</text>

  <!-- Divider rule -->
  <rect x="80" y="430" width="60" height="3" fill="#d4894a"/>

  <!-- Description -->
  <text x="80" y="475"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        fill="#6b5544">8+ years · $10M+ revenue driven · 0 dev teams</text>

  <!-- URL -->
  <text x="80" y="580"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="18"
        font-weight="600"
        letter-spacing="2"
        fill="#6b5544">ABIGAIL-ANTOLICK-SITE.VERCEL.APP</text>

  <!-- Dashboard motif (right side) -->
  <g transform="translate(800, 200)">
    <!-- Card background -->
    <rect x="0" y="0" width="320" height="280" rx="6" fill="#1f3934"/>

    <!-- Card title -->
    <text x="20" y="38"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="13"
          font-weight="700"
          letter-spacing="1.5"
          fill="#d4894a">REVENUE / LAST 12 WEEKS</text>

    <!-- Big number -->
    <text x="20" y="90"
          font-family="Georgia, serif"
          font-size="48"
          font-weight="700"
          fill="#f7f3ec">$94K</text>

    <!-- Sub-label -->
    <text x="20" y="116"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="14"
          fill="#a89b8a">↑ 31% vs last quarter</text>

    <!-- Bar chart -->
    <g transform="translate(20, 150)">
      <rect x="0"   y="80" width="20" height="20"  fill="#6b5544" opacity="0.5"/>
      <rect x="28"  y="60" width="20" height="40"  fill="#6b5544" opacity="0.6"/>
      <rect x="56"  y="50" width="20" height="50"  fill="#6b5544" opacity="0.7"/>
      <rect x="84"  y="35" width="20" height="65"  fill="#a89b8a" opacity="0.7"/>
      <rect x="112" y="40" width="20" height="60"  fill="#a89b8a" opacity="0.8"/>
      <rect x="140" y="25" width="20" height="75"  fill="#a89b8a"/>
      <rect x="168" y="20" width="20" height="80"  fill="#d4894a" opacity="0.8"/>
      <rect x="196" y="15" width="20" height="85"  fill="#d4894a" opacity="0.9"/>
      <rect x="224" y="10" width="20" height="90"  fill="#d4894a"/>
      <rect x="252" y="5"  width="20" height="95"  fill="#d4894a"/>
      <rect x="280" y="0"  width="20" height="100" fill="#d4894a"/>
    </g>

    <!-- X-axis baseline -->
    <line x1="20" y1="252" x2="300" y2="252" stroke="#a89b8a" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
