<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Image Generator — Abigail Antolick</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f4f1ea; padding: 40px; color: #1f3934; }
  h1 { font-family: Georgia, serif; }
  .preview { border: 1px solid #d4c8b2; box-shadow: 0 4px 24px rgba(0,0,0,.08); margin: 24px 0; max-width: 100%; }
  button { background: #d4894a; color: white; border: 0; padding: 14px 28px; font-size: 15px; font-weight: 700; letter-spacing: 1px; cursor: pointer; border-radius: 4px; margin-right: 12px; }
  button:hover { background: #b56b2e; }
  .note { color: #6b5544; max-width: 720px; line-height: 1.6; }
  code { background: #fff; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
</style>
</head>
<body>
<h1>OG Image Generator</h1>
<p class="note">Click <strong>Download PNG</strong> below. Save the file as <code>og-image.png</code> into your <code>/images/</code> folder, then commit and push. <em>You can delete this file (og-image-generator.html) after you're done — it's just a utility.</em></p>

<canvas id="canvas" width="1200" height="630" class="preview" style="width: 800px; height: auto;"></canvas>

<div>
  <button onclick="downloadPNG()">Download PNG</button>
</div>

<script>
const SVG_STRING = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f7f3ec"/>
  <rect x="0" y="0" width="14" height="630" fill="#d4894a"/>
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#e8e3d8" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#e8e3d8" stroke-width="1" opacity="0.6"/>
  <text x="80" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#d4894a">MARKETING STRATEGY + DASHBOARDS</text>
  <text x="80" y="240" font-family="Georgia, serif" font-size="86" font-weight="700" fill="#1f3934" letter-spacing="-2">Abigail Antolick</text>
  <text x="80" y="320" font-family="Georgia, serif" font-size="42" font-style="italic" fill="#1f3934">Strategy that moves the needle.</text>
  <text x="80" y="370" font-family="Georgia, serif" font-size="42" font-style="italic" fill="#1f3934">Dashboards that prove it.</text>
  <rect x="80" y="430" width="60" height="3" fill="#d4894a"/>
  <text x="80" y="475" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#6b5544">8+ years &middot; $10M+ revenue driven &middot; 0 dev teams</text>
  <text x="80" y="580" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#6b5544">ABIGAIL-ANTOLICK-SITE.VERCEL.APP</text>
  <g transform="translate(800, 200)">
    <rect x="0" y="0" width="320" height="280" rx="6" fill="#1f3934"/>
    <text x="20" y="38" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#d4894a">REVENUE / LAST 12 WEEKS</text>
    <text x="20" y="90" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#f7f3ec">$94K</text>
    <text x="20" y="116" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#a89b8a">&uarr; 31% vs last quarter</text>
    <g transform="translate(20, 150)">
      <rect x="0" y="80" width="20" height="20" fill="#6b5544" opacity="0.5"/>
      <rect x="28" y="60" width="20" height="40" fill="#6b5544" opacity="0.6"/>
      <rect x="56" y="50" width="20" height="50" fill="#6b5544" opacity="0.7"/>
      <rect x="84" y="35" width="20" height="65" fill="#a89b8a" opacity="0.7"/>
      <rect x="112" y="40" width="20" height="60" fill="#a89b8a" opacity="0.8"/>
      <rect x="140" y="25" width="20" height="75" fill="#a89b8a"/>
      <rect x="168" y="20" width="20" height="80" fill="#d4894a" opacity="0.8"/>
      <rect x="196" y="15" width="20" height="85" fill="#d4894a" opacity="0.9"/>
      <rect x="224" y="10" width="20" height="90" fill="#d4894a"/>
      <rect x="252" y="5" width="20" height="95" fill="#d4894a"/>
      <rect x="280" y="0" width="20" height="100" fill="#d4894a"/>
    </g>
    <line x1="20" y1="252" x2="300" y2="252" stroke="#a89b8a" stroke-width="1" opacity="0.4"/>
  </g>
</svg>`;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const img = new Image();
const svgBlob = new Blob([SVG_STRING], {type: 'image/svg+xml;charset=utf-8'});
const url = URL.createObjectURL(svgBlob);

img.onload = function() {
  ctx.fillStyle = '#f7f3ec';
  ctx.fillRect(0, 0, 1200, 630);
  ctx.drawImage(img, 0, 0, 1200, 630);
  URL.revokeObjectURL(url);
};
img.src = url;

function downloadPNG() {
  const link = document.createElement('a');
  link.download = 'og-image.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
